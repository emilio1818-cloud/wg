name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same build settings as the Pages deploy (repository variables, see docs/LAUNCH.md).
          build-args: |
            NESTLY_SITE_URL=${{ vars.NESTLY_SITE_URL }}
            NESTLY_TIP_URL=${{ vars.NESTLY_TIP_URL }}
            NESTLY_OFFERS=${{ vars.NESTLY_OFFERS }}
            NESTLY_OPERATOR_NAME=${{ vars.NESTLY_OPERATOR_NAME }}
            NESTLY_OPERATOR_ADDRESS=${{ vars.NESTLY_OPERATOR_ADDRESS }}
            NESTLY_OPERATOR_EMAIL=${{ vars.NESTLY_OPERATOR_EMAIL }}
            NESTLY_OPERATOR_PHONE=${{ vars.NESTLY_OPERATOR_PHONE }}
            NESTLY_LEGAL_HOSTING=${{ vars.NESTLY_LEGAL_HOSTING }}
            NESTLY_TWA_PACKAGE=${{ vars.NESTLY_TWA_PACKAGE }}
            NESTLY_TWA_SHA256=${{ vars.NESTLY_TWA_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
