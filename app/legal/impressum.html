<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Impressum – Nestly</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f4f3f9; --card: #fff; --text: #17151f; --muted: #5d5a6b; --accent: #6b4ef6; --line: #e4e2ee; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0a11; --card: #16141f; --text: #f2f1f7; --muted: #a9a6b8; --accent: #9d8bff; --line: #2a2736; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
      h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 20px; }
      h2 { font-size: 17px; margin: 24px 0 6px; }
      p { margin: 0 0 10px; }
      a { color: var(--accent); }
      .muted { color: var(--muted); font-size: 14px; }
      nav { margin-top: 20px; display: flex; gap: 16px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Impressum</h1>
        <h2>Angaben gemäß § 5 DDG</h2>
        <p>{{name}}<br />{{address}}</p>
        <h2>Kontakt</h2>
        <p>
          E-Mail: <a href="mailto:{{email}}">{{email}}</a>
          <!--IF:phone--><br />Telefon: {{phone}}<!--END:phone-->
        </p>
        <h2>Über diese App</h2>
        <p class="muted">Nestly ist eine App zur Organisation von Wohngemeinschaften. Der Quellcode ist Open Source (MIT-Lizenz).</p>
      </div>
      <nav>
        <a href="./">← Zurück zur App</a>
        <a href="datenschutz.html">Datenschutzerklärung</a>
      </nav>
    </main>
  </body>
</html>
